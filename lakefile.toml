name = "AustinPair"
version = "0.1.0"
defaultTargets = ["AustinPair", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.1"

[[require]]
name = "equational_theories"
git = "https://github.com/teorth/equational_theories.git"
rev = "e5a88a1479011ece4aad8e3c2e7e5c0ebc0a5b2a"

[[lean_lib]]
name = "AustinPair"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
moreLeanArgs = ["--tstack=262144"]
